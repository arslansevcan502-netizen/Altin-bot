name: Altin Takip

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python check_gold.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
